# The quality gate on every push and pull request (Step 14, ADR-0034).
#
# The same commands a developer runs locally (CLAUDE.md, the verify skill), so a red build here
# is reproducible on a laptop. Nothing in this workflow needs a secret: billed model calls
# (Category=Smoke, evaluation tier 2, the Playwright e2e) are excluded, and the integration
# tests start their own SQL Server and Qdrant in Docker, which hosted Ubuntu runners provide.

name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow builds and tests, it publishes nothing.
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Deterministic build output, and RestoreLockedMode (Directory.Build.props).
  ContinuousIntegrationBuild: "true"

jobs:
  dotnet:
    name: .NET build, format, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Locked: a dependency that resolves differently from packages.lock.json fails here.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Tools
        run: dotnet tool restore

      # .editorconfig does not gate the compiler (EnforceCodeStyleInBuild is off, step-04 §9);
      # this step is where style becomes a gate.
      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore

      # Unit, architecture, integration (Testcontainers) and evaluation tier 1 (cached
      # embeddings, no key). Smoke tests skip themselves without a key; filtered out anyway.
      - name: Test
        run: dotnet test --configuration Release --no-build --filter "Category!=Smoke" --logger "trx" --results-directory TestResults

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  web:
    name: Web client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/EKA.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/EKA.Web/package-lock.json

      - run: npm ci
      # The generated API types must match the checked-in OpenAPI document (ADR-0033).
      - run: npm run check:api
      - run: npm test
      - run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v4

      # Building proves the Dockerfiles, the locked restore inside them and the migration
      # bundle. Nothing is pushed: publishing images is a release decision, not a CI one.
      - name: Build api, worker, migrator, web
        run: |
          for target in api worker migrator; do
            docker build --file deploy/docker/dotnet.Dockerfile --target "$target" --tag "eka/$target:ci" .
          done
          docker build --file deploy/docker/web.Dockerfile --target web --tag eka/web:ci .

      # The compose files must parse, with every required variable supplied.
      - name: Validate compose
        env:
          MSSQL_SA_PASSWORD: ci-only-Placeholder-1
          KEYCLOAK_ADMIN_PASSWORD: ci-only-placeholder
          EKA_AI_API_KEY: ci-only-placeholder
          REDIS_PASSWORD: ci-only-placeholder
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml config --quiet
